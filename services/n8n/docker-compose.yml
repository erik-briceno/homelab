# n8n: automatizaciones y webhooks. Uso local desde la red de casa (o por Tailscale).
# En el NAS está creado como contenedor suelto (n8n_local); este compose lo reproduce.
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_local
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./data:/home/node/.n8n

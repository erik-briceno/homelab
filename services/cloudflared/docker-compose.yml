# Cloudflare Tunnel: publica servicios en Internet sin abrir puertos en el router.
# Las rutas (subdominio -> http://IP-del-NAS:puerto) se configuran en el panel de Cloudflare Zero Trust.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

# AdGuard Home: DNS de la red de casa con bloqueo de publicidad y rastreadores,
# y registro de consultas por dispositivo (la familia está avisada).
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3001:3000/tcp"   # asistente de instalación (luego el panel queda en el puerto que elijas)
      - "8080:80/tcp"     # panel web
    volumes:
      - ./data/work:/opt/adguardhome/work
      - ./data/conf:/opt/adguardhome/conf

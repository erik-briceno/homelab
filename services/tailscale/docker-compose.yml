# Tailscale: VPN WireGuard para entrar a la red de casa desde el móvil.
# El NAS hace de exit node (el móvil puede salir a Internet por casa)
# y de subnet router (desde fuera se ve toda la red 192.168.1.0/24).
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ugreen-nas
    network_mode: host
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ./state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-exit-node --advertise-routes=192.168.1.0/24
